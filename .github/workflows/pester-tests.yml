name: Pester Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - uses: PowerShell/setup-powershell@v2
        with:
          pwsh-version: 7.4
      
      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module -Name Pester -Force -SkipPublisherCheck
      
      - name: Run Tests
        shell: pwsh
        run: |
          Invoke-Pester -Path ./tests/ -OutputFile testresults.xml -OutputFormat JunitXml -EnableExit
      
      - name: Publish Results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: testresults.xml

  lint:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - uses: PowerShell/setup-powershell@v2
      
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module -Name PSScriptAnalyzer -Force
      
      - name: Lint
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path ./ -Recurse
          if ($results) { exit 1 }
